# r8_pcsr.cfg — OpenOCD config for PM9M1 (ARM Cortex-R8, SWD)
#
# 타깃 오브젝트 이름은 퍼저 코드와 반드시 일치해야 한다 (tcl_prefix='r8'):
#   r8.dap  — DP power-up / sticky clear   (pc_sampling_fuzzer: '{px}.dap dpreg ...')
#   r8.abp  — AP 0, PCSR read_memory       ('{px}.abp read_memory ...')
#   r8.axi  — AP 1, per-core debug power   ('{px}.axi read_memory/write_memory ...')
# JTAG 판은 products/BM9H1/openocd.cfg (구 r8_pcsr_jtag.cfg).

adapter driver jlink
adapter speed 4000
transport select swd
reset_config none
swd newdap r8 cpu -enable
dap create r8.dap -chain-position r8.cpu
target create r8.abp mem_ap -dap r8.dap -ap-num 0
target create r8.axi mem_ap -dap r8.dap -ap-num 1
init
